name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API build, migrations check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore api/RequestDesk.slnx

      - name: Build (warnings are errors)
        run: dotnet build api/RequestDesk.slnx --configuration Release --no-restore

      # The model snapshot has to match the entity configuration. A forgotten migration fails here,
      # not at deploy time.
      - name: Confirm there are no pending model changes
        working-directory: api
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes \
            --project src/RequestDesk.Infrastructure \
            --startup-project src/RequestDesk.Api \
            --no-build --configuration Release

      # Domain and application tests are plain unit tests. The integration tests start a real
      # PostgreSQL in Docker through Testcontainers; the hosted runner has Docker available.
      - name: Test
        run: >
          dotnet test api/RequestDesk.slnx --configuration Release --no-build
          --logger "trx;LogFileName=results.trx" --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: TestResults

  web:
    name: Web format, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Production build
        run: npm run build -- --configuration production

  e2e:
    name: End to end on the compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [api, web]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Wait for the API to report healthy
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8085/health > /dev/null; then exit 0; fi
            sleep 3
          done
          echo "API never became healthy"; docker compose logs api; exit 1

      - name: Install Playwright
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the end-to-end spec
        working-directory: web
        env:
          BASE_URL: http://localhost:8085
        run: npx playwright test --project chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Format check
        run: terraform fmt -check -recursive

      # Validate only. This module is reference infrastructure and is deliberately not applied.
      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
