<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RequestDesk</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A service request tracker: customers submit, agents work, admins watch the queue."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
    <script>
      // Runs before first paint: a saved choice has to be on <html> before the body renders, or
      // the app flashes the system theme first. Mirrors ThemeService, which owns it afterwards.
      (function () {
        try {
          var saved = localStorage.getItem('ep-theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-ep-theme', saved);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
