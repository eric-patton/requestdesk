# Fly.io configuration for the API. Deploy from the repository root:
#
#   flyctl deploy --config infra/fly/api.toml --dockerfile api/Dockerfile --remote-only .
#
# Secrets, set once and never committed:
#
#   flyctl secrets set --app requestdesk-api \
#     ConnectionStrings__Default="Host=...;Database=...;Username=...;Password=...;SSL Mode=Require" \
#     Jwt__SigningKey="$(openssl rand -base64 48)"

app = "requestdesk-api"
primary_region = "iad"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  Demo__Enabled = "true"
  Demo__ResetIntervalMinutes = "60"
  Storage__Root = "/data/attachments"
  # The web app proxies /api on the same origin, so no browser origin needs CORS here.

[http_service]
  internal_port = 8080
  force_https = true
  # Always awake. A demo that takes fifty seconds to wake up is worse than no demo.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health/live"

[[mounts]]
  source = "requestdesk_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
