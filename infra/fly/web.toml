# Fly.io configuration for the nginx front end. It serves the Angular build and proxies /api to the
# API app over Fly's private network, so the browser sees one origin.
#
#   flyctl deploy --config infra/fly/web.toml --dockerfile web/Dockerfile --remote-only .

app = "requestdesk-web"
primary_region = "iad"

[env]
  API_UPSTREAM = "http://requestdesk-api.internal:8080"
  # Fly's internal DNS, so nginx re-resolves the API address after the API redeploys.
  DNS_RESOLVER = "[fdaa::3]"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
